<!DOCTYPE html>
<html>
<head>
    <title>Suppliers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">Cafe Inventory</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/products">Products</a>
            <a class="nav-link" href="/inventory">Inventory</a>
            <a class="nav-link" href="/recipes">Recipes</a>
            <a class="nav-link" href="/suppliers">Suppliers</a>
            <a class="nav-link" href="/transactions">Transactions</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Suppliers</h1>
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addSupplierModal">Add Supplier</button>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Company Name</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for supplier in suppliers %}
                <tr>
                    <td>{{ supplier.id }}</td>
                    <td>{{ supplier.company_name }}</td>
                    <td>{{ supplier.contact_person }}</td>
                    <td>{{ supplier.phone }}</td>
                    <td>
                        <button class="btn btn-warning btn-sm edit-btn" data-id="{{ supplier.id }}" data-bs-toggle="modal" data-bs-target="#editSupplierModal">Edit</button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="{{ supplier.id }}">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Add Modal -->
        <div class="modal fade" id="addSupplierModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Supplier</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="addSupplierForm">
                            <div class="mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" name="company_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contact Person</label>
                                <input type="text" class="form-control" name="contact_person">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" name="phone">
                            </div>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="editSupplierModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Supplier</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editSupplierForm">
                            <input type="hidden" id="editSupplierId">
                            <div class="mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="editCompanyName" name="company_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contact Person</label>
                                <input type="text" class="form-control" id="editContactName" name="contact_person" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="editPhone" name="phone">
                            </div>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // 添加产品
            $('#addSupplierForm').on('submit', function(e) {
                e.preventDefault();
                $.ajax({
                    url: '/suppliers',
                    type: 'POST',
                    data: $(this).serialize(),
                    success: function(response) {
                        alert('Supplier added!');
                        location.reload();
                    },
                    error: function() {
                        alert('Error adding supplier.');
                    }
                });
            });

            // 编辑产品
            $('.edit-btn').on('click', function() {
                const id = $(this).data('id');
                $('#editSupplierId').val(id);
                // 填充模态窗数据（假设已有逻辑）
                $('#editSupplierModal').modal('show');
            });

            $('#editSupplierForm').on('submit', function(e) {
                e.preventDefault();
                const id = $('#editSupplierId').val();
                const formData = $(this).serialize();
                console.log('Sending update data:', formData);
                $.ajax({
                    url: `/suppliers/${id}`,
                    type: 'PUT',
                    data: formData,
                    success: function(response) {
                        console.log('Update success:', response);
                        alert(response.message || 'Supplier updated!');
                        location.reload();
                    },
                    error: function(xhr) {
                        console.log('Update error:', xhr.status, xhr.responseText);
                        alert('Error updating supplier: ' + xhr.responseText);
                    }
                });
            });

            // 删除产品
            $('.delete-btn').on('click', function() {
                if (confirm('Are you sure you want to delete this supplier?')) {
                    const id = $(this).data('id');
                    console.log('Deleting supplier id:', id);
                    $.ajax({
                        url: `/suppliers/${id}`, 
                        type: 'DELETE',
                        success: function(response) {
                            console.log('Delete success:', response);
                            alert(response.message || 'Supplier deleted!');
                            location.reload();
                        },
                        error: function(xhr) {
                            console.log('Delete error:', xhr.status, xhr.responseText);
                            alert('Error deleting supplier: ' + xhr.responseText);
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
