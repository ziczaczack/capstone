{% extends "base.html" %}

{% block title %}Import CSV - Cafe Inventory{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 50px;">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">📂 Import Data</h3>
    </div>
    <div class="card-body">
      <form action="/import" method="post" enctype="multipart/form-data">
        <div class="mb-4">
          <label for="table" class="form-label fw-bold">1. Select Table</label>
          <div class="input-group">
            <select name="table" id="table" class="form-select">
              <option value="inventory">Inventory</option>
              <option value="products">Products</option>
              <option value="recipes">Recipes</option>
              <option value="suppliers">Suppliers</option>
              <option value="transactions">Transactions</option>
            </select>
            <button type="button" class="btn btn-outline-secondary" id="downloadBtn" title="Download Template">
              ⬇️ Template
            </button>
          </div>
          <div class="form-text">Download the template to see the required columns.</div>
        </div>

        <div class="mb-4">
          <label for="file" class="form-label fw-bold">2. Upload CSV File</label>
          <input type="file" name="file" id="file" accept=".csv" class="form-control" required />
          <div class="form-text text-warning">
            ⚠️ Existing items with the same ID/SKU will be updated.
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">🚀 Start Import</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Update download link when table changes
  const tableSelect = document.getElementById('table');
  const downloadBtn = document.getElementById('downloadBtn');

  function updateDownloadLink() {
    const table = tableSelect.value;
    // We use window.location to trigger the download
    downloadBtn.onclick = () => window.location.href = `/import/template?table=${table}`;
  }

  tableSelect.addEventListener('change', updateDownloadLink);
  updateDownloadLink(); // Init
</script>
{% endblock %}
