<!DOCTYPE html>
<html>
<head>
    <title>Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">Cafe Inventory</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/products">Products</a>
            <a class="nav-link" href="/inventory">Inventory</a>
            <a class="nav-link" href="/recipes">Recipes</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Recipes</h1>
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addRecipeModal">Add Recipe</button>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Ingredient SKU</th>
                    <th>Usage</th>
                    <th>Unit</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for recipe in recipes %}
                <tr>
                    <td>{{ recipe.id }}</td>
                    <td>{{ recipe.product_name }}</td>
                    <td>{{ recipe.inventory_sku }}</td>
                    <td>{{ recipe.usage }}</td>
                    <td>{{ recipe.unit }}</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <!-- Modal for adding recipe -->
        <div class="modal fade" id="addRecipeModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Recipe</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form action="/recipes" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" name="product_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ingredient SKU</label>
                                <input type="text" class="form-control" name="ingredient_sku" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Usage</label>
                                <input type="number" step="0.01" class="form-control" name="usage" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Unit</label>
                                <input type="text" class="form-control" name="unit" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
