<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cafe Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: var(--accent);
            border-radius: 16px;
            display: grid;
            place-items: center;
            margin: 0 auto 24px;
            color: white;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(206, 198, 141, 0.25);
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-control {
            background: var(--bg-alt);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .form-label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card login-card">
        <div class="brand-logo">☕</div>
        <h1 class="login-title">Inventory Management</h1>
        <p class="login-subtitle">Please enter your details to sign in</p>

        <form method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username"
                    required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                    placeholder="Enter your password" required>
            </div>

            <button type="submit" class="primary-action btn-login">Sign In</button>
        </form>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-danger mt-4 mb-0" style="font-size: 14px; padding: 12px; border-radius: 10px;">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}
    </div>

</body>

</html>
